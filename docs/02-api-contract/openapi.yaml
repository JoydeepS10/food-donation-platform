openapi: 3.0.3
info:
  title: Food Donation Coordination API
  version: 1.0.0
  license:
    name: Proprietary
  description: |
    Source of truth for the food donation platform API.

    Every operation declares `x-slice`, `x-required-roles` and
    `x-requires-verified-organisation`. See `API_NOTES.md` for the shared error envelope,
    role semantics, pagination and projection rules. Slice 6 adds no endpoints.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Health
    description: Liveness and readiness.
  - name: Auth
    description: Registration, login, logout and session identity.
  - name: Donations
    description: Publishing, browsing, editing and cancelling surplus food listings.
  - name: Claims
    description: Atomic claiming, pickup confirmation, completion and claim history.
  - name: Organisations
    description: Own organisation profile and verification documents.
  - name: Admin
    description: Organisation verification and document review.
  - name: Notifications
    description: In-app notification inbox.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health
      x-slice: 1
      x-required-roles: [public]
      x-requires-verified-organisation: false
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerOrganisation
      summary: Register a donor or NGO organisation and its single user
      description: Creates the organisation in `pending` state and its user. Sets a session cookie; transactional actions remain blocked until organisation verification.
      x-slice: 1
      x-required-roles: [public]
      x-requires-verified-organisation: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; session cookie set
          headers:
            Set-Cookie:
              description: Opaque `fd_session` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      x-slice: 1
      x-required-roles: [public]
      x-requires-verified-organisation: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session cookie set
          headers:
            Set-Cookie:
              description: Opaque `fd_session` cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out the current session
      x-slice: 1
      x-required-roles: [donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user and organisation
      x-slice: 1
      x-required-roles: [donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /donations:
    get:
      tags: [Donations]
      operationId: listDonations
      summary: List donations with filters and pagination
      description: |
        Anonymous and ordinary NGO callers see only available donations, masked.
        A donor may use `mine=true` to see all own donations. An admin sees all statuses.
        A status filter other than `available` requires donor `mine=true` or an admin.
      x-slice: 2
      x-required-roles: [public, donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: city
          in: query
          schema: { type: string, maxLength: 120 }
        - name: area
          in: query
          schema: { type: string, maxLength: 120 }
        - name: isVegetarian
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DonationStatus'
        - name: mine
          in: query
          description: Only an authenticated donor may set this to true.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            enum: [ending_soon, newest]
            default: ending_soon
      responses:
        '200':
          description: Paginated donations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Donations]
      operationId: createDonation
      summary: Create and publish a donation
      x-slice: 2
      x-required-roles: [donor]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCreateRequest'
      responses:
        '201':
          description: Donation created as `available`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /donations/{donationId}:
    parameters:
      - $ref: '#/components/parameters/DonationId'
    get:
      tags: [Donations]
      operationId: getDonation
      summary: Donation detail
      description: Projection depends on the caller; public callers receive masked details only.
      x-slice: 2
      x-required-roles: [public, donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }, {}]
      responses:
        '200':
          description: Donation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Donations]
      operationId: updateDonation
      summary: Edit an own donation
      description: Content edits are allowed only while `available`. While `claimed`, only a later pickup end (not beyond best-before) is allowed.
      x-slice: 2
      x-required-roles: [donor]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationUpdateRequest'
      responses:
        '200':
          description: Updated donation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /donations/{donationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DonationId'
    post:
      tags: [Donations]
      operationId: cancelDonation
      summary: Cancel an available or claimed donation
      description: Allowed for the owning donor or an admin. Cancelling a claimed donation also cancels its active claim.
      x-slice: 2
      x-required-roles: [donor, admin]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDonationRequest'
      responses:
        '200':
          description: Donation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /donations/{donationId}/claims:
    parameters:
      - $ref: '#/components/parameters/DonationId'
    post:
      tags: [Claims]
      operationId: claimDonation
      summary: Claim an available donation
      description: Atomic first-come-first-served claim. Retried by the same NGO is idempotent; a different NGO receives 409.
      x-slice: 3
      x-required-roles: [ngo]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Claim created; full pickup details revealed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /donations/{donationId}/status:
    parameters:
      - $ref: '#/components/parameters/DonationId'
    patch:
      tags: [Claims]
      operationId: updateDonationStatus
      summary: Perform an allowed lifecycle action
      description: |
        `mark_picked_up` and `release_claim` are for the NGO holding the active claim.
        `confirm_completed` is for the owning donor. Cancellation uses the donation cancel endpoint.
      x-slice: 3
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Updated donation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /claims/me:
    get:
      tags: [Claims]
      operationId: listMyClaims
      summary: List the NGO's own claims
      x-slice: 3
      x-required-roles: [ngo]
      x-requires-verified-organisation: true
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClaimStatus'
      responses:
        '200':
          description: Paginated claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /organisations/me:
    get:
      tags: [Organisations]
      operationId: getMyOrganisation
      summary: Own organisation profile and current documents
      x-slice: 4
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organisation profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Organisations]
      operationId: updateMyOrganisation
      summary: Update own organisation profile
      x-slice: 4
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationUpdateRequest'
      responses:
        '200':
          description: Updated organisation profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /organisations/me/documents:
    post:
      tags: [Organisations]
      operationId: uploadVerificationDocument
      summary: Upload a verification document
      description: Allowed while the organisation is pending or rejected; document renewal after verification is out of scope.
      x-slice: 4
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, file]
              properties:
                documentType:
                  $ref: '#/components/schemas/DocumentType'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document stored as current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /organisations/me/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Organisations]
      operationId: downloadMyVerificationDocument
      summary: Download an own verification document
      x-slice: 4
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Document bytes
          headers:
            Content-Disposition:
              description: Attachment with the original filename
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /organisations/me/verification:
    post:
      tags: [Organisations]
      operationId: submitOrganisationForVerification
      summary: Submit or resubmit the organisation for review
      x-slice: 4
      x-required-roles: [donor, ngo]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/organisations:
    get:
      tags: [Admin]
      operationId: listOrganisationsForVerification
      summary: List organisations for admin review
      x-slice: 4
      x-required-roles: [admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: verificationStatus
          in: query
          schema:
            $ref: '#/components/schemas/OrgVerificationStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrgType'
        - name: city
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Paginated organisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganisationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/organisations/{organisationId}:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
    get:
      tags: [Admin]
      operationId: getOrganisationForVerification
      summary: Organisation detail for admin review
      x-slice: 4
      x-required-roles: [admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organisation profile and documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/organisations/{organisationId}/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Admin]
      operationId: adminDownloadVerificationDocument
      summary: Download an organisation's verification document
      x-slice: 4
      x-required-roles: [admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Document bytes
          headers:
            Content-Disposition:
              description: Attachment with the original filename
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/organisations/{organisationId}/verification:
    parameters:
      - $ref: '#/components/parameters/OrganisationId'
    post:
      tags: [Admin]
      operationId: decideOrganisationVerification
      summary: Approve or reject an organisation
      x-slice: 4
      x-required-roles: [admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's notifications
      x-slice: 5
      x-required-roles: [donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated notification inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      x-slice: 5
      x-required-roles: [donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      x-slice: 5
      x-required-roles: [donor, ngo, admin]
      x-requires-verified-organisation: false
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fd_session
      description: Opaque session cookie; HttpOnly, Secure in production, SameSite=Lax.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    DonationId:
      name: donationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganisationId:
      name: organisationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    UserRole:
      type: string
      enum: [donor, ngo, admin]
    OrgType:
      type: string
      enum: [donor, ngo]
    OrgVerificationStatus:
      type: string
      enum: [pending, verified, rejected]
    DocumentType:
      type: string
      enum: [business_registration, food_safety_licence, ngo_registration, institution_authorisation, other]
    DocumentStatus:
      type: string
      enum: [pending, approved, rejected]
    QuantityUnit:
      type: string
      enum: [kg, portions, meals, packets]
    DonationStatus:
      type: string
      enum: [available, claimed, picked_up, completed, expired, cancelled]
    ClaimStatus:
      type: string
      enum: [active, cancelled, completed]
    NotificationType:
      type: string
      enum:
        - organisation_verified
        - organisation_rejected
        - donation_claimed
        - claim_released
        - donation_cancelled
        - pickup_confirmed
        - donation_completed
        - donation_expired
    VerificationDecision:
      type: string
      enum: [verified, rejected]

    FieldError:
      type: object
      required: [message]
      properties:
        field:
          type: string
          description: JSON path, query or header name.
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              example: DONATION_ALREADY_CLAIMED
            message:
              type: string
              example: This donation has already been claimed.
            requestId:
              type: string
              format: uuid
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    Address:
      type: object
      required: [line1, area, city]
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
          nullable: true
        area:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        postcode:
          type: string
          maxLength: 16
          nullable: true

    User:
      type: object
      required: [id, role, email, emailVerified, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        organisationId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OrganisationSummary:
      type: object
      required: [id, type, name, area, city]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OrgType'
        name:
          type: string
        area:
          type: string
        city:
          type: string

    DocumentMetadata:
      type: object
      required: [id, documentType, status, isCurrent, originalFilename, mimeType, sizeBytes, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        isCurrent:
          type: boolean
        originalFilename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewNote:
          type: string
          nullable: true

    OrganisationProfile:
      type: object
      required: [id, type, name, contactName, contactPhone, contactEmail, address, verificationStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OrgType'
        name:
          type: string
        registrationNumber:
          type: string
          nullable: true
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        verificationStatus:
          $ref: '#/components/schemas/OrgVerificationStatus'
        verificationSubmittedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMetadata'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        organisation:
          type: object
          allOf:
            - $ref: '#/components/schemas/OrganisationSummary'
          nullable: true
        sessionExpiresAt:
          type: string
          format: date-time
          nullable: true

    RegisterRequest:
      type: object
      required:
        - organisationType
        - organisationName
        - contactName
        - contactPhone
        - contactEmail
        - address
        - email
        - password
      properties:
        organisationType:
          $ref: '#/components/schemas/OrgType'
        organisationName:
          type: string
          minLength: 2
          maxLength: 160
        registrationNumber:
          type: string
          maxLength: 80
          nullable: true
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 7
          maxLength: 32
        contactEmail:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    PickupWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    PickupDetails:
      type: object
      required: [line1, area, city]
      properties:
        line1:
          type: string
        line2:
          type: string
          nullable: true
        area:
          type: string
        city:
          type: string
        postcode:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true

    DonorContact:
      type: object
      required: [name, phone, email]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    DonationSummary:
      type: object
      required:
        - id
        - title
        - description
        - isVegetarian
        - quantity
        - unit
        - bestBefore
        - pickupWindow
        - pickupArea
        - pickupCity
        - status
        - donor
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        isVegetarian:
          type: boolean
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/QuantityUnit'
        bestBefore:
          type: string
          format: date-time
        pickupWindow:
          $ref: '#/components/schemas/PickupWindow'
        pickupArea:
          type: string
        pickupCity:
          type: string
        photoUrl:
          type: string
          format: uri
          nullable: true
        allergenNotes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/DonationStatus'
        donor:
          $ref: '#/components/schemas/OrganisationSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ActiveClaimSummary:
      type: object
      required: [id, status, claimedAt, ngo]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ClaimStatus'
        claimedAt:
          type: string
          format: date-time
        ngo:
          $ref: '#/components/schemas/OrganisationSummary'

    DonationDetail:
      allOf:
        - $ref: '#/components/schemas/DonationSummary'
        - type: object
          properties:
            pickup:
              type: object
              allOf:
                - $ref: '#/components/schemas/PickupDetails'
              nullable: true
              description: Present only for the donor owner, the NGO holding the active claim, or an admin.
            donorContact:
              type: object
              allOf:
                - $ref: '#/components/schemas/DonorContact'
              nullable: true
              description: Present only for the NGO holding the active claim or an admin.
            activeClaim:
              type: object
              allOf:
                - $ref: '#/components/schemas/ActiveClaimSummary'
              nullable: true

    DonationCreateRequest:
      type: object
      required:
        - title
        - description
        - isVegetarian
        - quantity
        - unit
        - bestBefore
        - pickupWindow
        - pickupAddress
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          minLength: 10
          maxLength: 2000
        isVegetarian:
          type: boolean
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        unit:
          $ref: '#/components/schemas/QuantityUnit'
        bestBefore:
          type: string
          format: date-time
        pickupWindow:
          $ref: '#/components/schemas/PickupWindow'
        pickupAddress:
          $ref: '#/components/schemas/Address'
        pickupInstructions:
          type: string
          maxLength: 1000
          nullable: true
        allergenNotes:
          type: string
          maxLength: 500
          nullable: true

    DonationUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          minLength: 10
          maxLength: 2000
        isVegetarian:
          type: boolean
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        unit:
          $ref: '#/components/schemas/QuantityUnit'
        bestBefore:
          type: string
          format: date-time
        pickupWindow:
          $ref: '#/components/schemas/PickupWindow'
        pickupAddress:
          $ref: '#/components/schemas/Address'
        pickupInstructions:
          type: string
          maxLength: 1000
          nullable: true
        allergenNotes:
          type: string
          maxLength: 500
          nullable: true

    CancelDonationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    StatusUpdateRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [mark_picked_up, confirm_completed, release_claim]
        reason:
          type: string
          minLength: 3
          maxLength: 500
          nullable: true
          description: Required when action is `release_claim`.

    DonationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DonationSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    Claim:
      type: object
      required: [id, donationId, status, claimedAt, ngo, donation]
      properties:
        id:
          type: string
          format: uuid
        donationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ClaimStatus'
        claimedAt:
          type: string
          format: date-time
        pickupConfirmedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
        ngo:
          $ref: '#/components/schemas/OrganisationSummary'
        donation:
          $ref: '#/components/schemas/DonationSummary'
        pickup:
          type: object
          allOf:
            - $ref: '#/components/schemas/PickupDetails'
          nullable: true
          description: Present only while the claim is active.
        donorContact:
          type: object
          allOf:
            - $ref: '#/components/schemas/DonorContact'
          nullable: true
          description: Present only while the claim is active.

    ClaimListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        pagination:
          $ref: '#/components/schemas/Pagination'

    OrganisationUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 7
          maxLength: 32
        contactEmail:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'

    VerificationSubmissionResponse:
      type: object
      required: [verificationStatus, submittedAt]
      properties:
        verificationStatus:
          $ref: '#/components/schemas/OrgVerificationStatus'
        submittedAt:
          type: string
          format: date-time

    AdminOrganisationSummary:
      type: object
      required: [id, type, name, city, verificationStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OrgType'
        name:
          type: string
        city:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/OrgVerificationStatus'
        verificationSubmittedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminOrganisationListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganisationSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    DocumentReviewInput:
      type: object
      required: [documentId, status]
      properties:
        documentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected]
        note:
          type: string
          maxLength: 500
          nullable: true

    VerificationDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/VerificationDecision'
        reason:
          type: string
          maxLength: 1000
          nullable: true
          description: Required when decision is `rejected`.
        documentReviews:
          type: array
          items:
            $ref: '#/components/schemas/DocumentReviewInput'

    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        donationId:
          type: string
          format: uuid
          nullable: true
        claimId:
          type: string
          format: uuid
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        emailedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [data, pagination, unreadCount]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
        unreadCount:
          type: integer
          minimum: 0

    ReadAllResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role or organisation-verification requirement not met
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict or duplicate resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Uploaded file exceeds the allowed size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Uploaded file type is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
